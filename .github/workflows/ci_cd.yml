name: CI/CD Pipeline & pub.dev Publisher

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  id-token: write
  contents: write

jobs:
  test_and_lint:
    name: Build, Lint & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Install Dependencies
        run: flutter pub get

      - name: 4. Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: 5. Static Analysis & Lint Checks
        run: flutter analyze

      - name: 6. Run Unit & Widget Tests
        run: flutter test

      - name: 7. Package Dry-Run Publishing Check
        run: flutter pub publish --dry-run

  publish_to_pub_dev:
    name: Automated Publish to pub.dev & Auto-Tag Release
    needs: test_and_lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Dart Environment
        uses: dart-lang/setup-dart@v1

      - name: 3. Install Dependencies
        run: dart pub get

      - name: 4. Publish Package to pub.dev
        run: dart pub publish --force

      - name: 5. Create & Push Release Version Tag on Success
        if: success()
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TAG="v$VERSION"
          echo "Package published successfully to pub.dev! Creating version tag: $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag -a "$TAG" -m "Release $TAG published to pub.dev"
            git push origin "$TAG"
            echo "Successfully created and pushed tag $TAG to GitHub repository."
          fi
